# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Check formatting
      run: sbt scalafmtCheckAll
    - name: Run scalafix
      run: sbt "scalafixAll --check"
    - name: Compile
      run: sbt compile
    - name: Run tests
      run: sbt test
      # sbt 2's server persists across steps; without a shutdown the dependency
      # submission below reuses it and misses its step-scoped GITHUB_TOKEN
      # (scalacenter/sbt-dependency-submission#364).
    - name: Shut down sbt server
      run: sbt shutdown
      # Optional: This step uploads information to the GitHub dependency graph and unblocking Dependabot alerts for the repository
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
